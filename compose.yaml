services:
  fan-control:
    image: ${FAN_CONTROL_IMAGE:-server-fan-control:local}
    platform: linux/amd64
    user: "0:0"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
      FAN_CONTROL_CONFIG: "${FAN_CONTROL_CONFIG:-/data/config.json}"
      FAN_CONTROL_LISTEN: "${FAN_CONTROL_LISTEN:-0.0.0.0:8080}"
      FAN_CONTROL_ADMIN_TOKEN_FILE: "${FAN_CONTROL_ADMIN_TOKEN_FILE:-/run/secrets/admin-token}"
      FAN_CONTROL_PUBLIC_ORIGIN: "${FAN_CONTROL_PUBLIC_ORIGIN:-}"
      FAN_CONTROL_SECURE_COOKIES: "${FAN_CONTROL_SECURE_COOKIES:-false}"
      FAN_CONTROL_MOCK: "${FAN_CONTROL_MOCK:-false}"
      FAN_CONTROL_DEV_NO_AUTH: "${FAN_CONTROL_DEV_NO_AUTH:-false}"
      FAN_CONTROL_DIAGNOSE: "${FAN_CONTROL_DIAGNOSE:-false}"
      FAN_CONTROL_DIAGNOSE_IPMI: "${FAN_CONTROL_DIAGNOSE_IPMI:-false}"
      FAN_CONTROL_IPMI_ENABLED: "${FAN_CONTROL_IPMI_ENABLED:-false}"
      FAN_CONTROL_SMART_ENABLED: "${FAN_CONTROL_SMART_ENABLED:-false}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_UUID:?Set NVIDIA_GPU_UUID to the target GPU UUID}"]
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${FAN_CONTROL_CONFIG_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${FAN_CONTROL_TOKEN_FILE:?Set FAN_CONTROL_TOKEN_FILE to the admin secret file}
        target: /run/secrets/admin-token
        read_only: true
        bind:
          create_host_path: false
