services:
  fan-control:
    image: ${FAN_CONTROL_IMAGE:-nvidia-fan-control:local}
    platform: linux/amd64
    user: "0:0"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --config
      - /data/config.json
      - --listen
      - 0.0.0.0:8080
      - --admin-token-file
      - /run/secrets/admin-token
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_UUID:?Set NVIDIA_GPU_UUID to the target GPU UUID}"]
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${FAN_CONTROL_CONFIG_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${FAN_CONTROL_TOKEN_FILE:?Set FAN_CONTROL_TOKEN_FILE to the admin secret file}
        target: /run/secrets/admin-token
        read_only: true
        bind:
          create_host_path: false
