name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build CGO binary without NVIDIA tooling
      run: docker build --platform linux/amd64 --target build --tag nvidia-fan-control:build .
    - name: Test and vet in the matching Go builder
      run: |
        docker run --rm nvidia-fan-control:build go test -race ./...
        docker run --rm nvidia-fan-control:build go vet ./...
    - name: Build runtime image
      run: docker build --platform linux/amd64 --tag nvidia-fan-control:local .
    - name: Check runtime contents, size and no-GPU startup
      run: sh scripts/check-image.sh nvidia-fan-control:local
    - name: Mock service lifecycle in the runtime container
      run: python3 scripts/smoke-service.py nvidia-fan-control:local
    - name: Validate GPU Compose example
      env:
        NVIDIA_GPU_UUID: GPU-ci-placeholder
        FAN_CONTROL_TOKEN_FILE: /tmp/ci-token-placeholder
      run: docker compose config --quiet

  browser:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.3'
    - uses: actions/setup-node@v4
      with:
        node-version: '24.22.2'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm --prefix web ci
    - run: npm --prefix web run check
    - run: npm --prefix web run build
    - name: Install browser
      working-directory: web
      run: npx playwright install --with-deps chromium
    - name: Browser tests against Go mock service
      run: npm --prefix web test
